<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170">
<style>
.leaf{transform-origin:384px 95px;animation:flip 2.8s ease-in-out infinite}
@keyframes flip{0%,40%{transform:scaleX(1)}55%,85%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.arrow{animation:dashslide 1.4s ease-in-out infinite}
.clickme{transform-origin:727px 137px;animation:cmpulse 1.1s ease-in-out infinite}
@keyframes cmpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}</style>
<defs><pattern id="tone2" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="6.5" cy="6.5" r="2.5" fill="#9A9A9A" opacity="0.5"/></pattern></defs>

<rect width="1200" height="170" fill="#F7F4EC"/>
<rect width="1200" height="170" fill="url(#tone2)"/>
<rect x="70" y="50" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="1060" y="50" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="96" y="84" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="1086" y="84" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="122" y="50" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="1112" y="50" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="148" y="84" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="1138" y="84" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="174" y="50" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/><rect x="1164" y="50" width="16" height="8" rx="4" fill="#141414" opacity="0.35"/>
<g>
  <rect x="254" y="40" width="130" height="110" rx="4" fill="#FFFFFF" stroke="#141414" stroke-width="5"/>
  <rect x="270" y="62" width="98" height="7" fill="#9A9A9A"/>
  <rect x="270" y="82" width="98" height="7" fill="#9A9A9A"/>
  <rect x="270" y="102" width="70" height="7" fill="#9A9A9A"/>
  <rect x="384" y="40" width="8" height="110" fill="#141414"/>
  <g class="leaf">
    <rect x="384" y="40" width="130" height="110" rx="4" fill="#FFFFFF" stroke="#141414" stroke-width="5"/>
    <rect x="400" y="62" width="98" height="7" fill="#9A9A9A"/>
    <rect x="400" y="82" width="98" height="7" fill="#9A9A9A"/>
    <rect x="400" y="102" width="70" height="7" fill="#9A9A9A"/>
  </g>
  <rect x="244" y="150" width="280" height="10" rx="5" fill="#141414" opacity="0.18"/>
</g>
<text x="584" y="108" font-family="Impact, 'Arial Black', sans-serif" font-size="44" fill="#141414" text-anchor="start" stroke="#F7F4EC" stroke-width="10" paint-order="stroke fill">TURN THE PAGE</text>
<g transform="rotate(-6 727 137)">
  <g class="clickme">
    <rect x="666" y="120" width="122" height="34" rx="17" fill="#D42A1E"/>
    <text x="727" y="144" font-family="Impact, 'Arial Black', sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">CLICK ME!</text>
  </g>
</g>
<g transform="rotate(-5 1024 88)">
  <rect x="954" y="62" width="140" height="46" fill="#F7F4EC" stroke="#D42A1E" stroke-width="4"/>
  <text x="1024" y="96" font-family="'Yu Gothic UI', 'Yu Gothic', 'Microsoft YaHei', 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="26" fill="#D42A1E" text-anchor="middle">つづく</text>
</g>
<text x="1140" y="108" font-family="Impact, 'Arial Black', sans-serif" font-size="34" fill="#D42A1E" text-anchor="middle" class="arrow">&#9654;</text>
</svg>
