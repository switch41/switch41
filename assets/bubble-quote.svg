<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230">
<style>
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}</style>
<defs><pattern id="tone3" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="3" fill="#9A9A9A" opacity="0.5"/></pattern></defs>

<rect width="900" height="230" fill="#F7F4EC"/>
<rect x="0" y="0" width="240" height="110" fill="url(#tone3)"/>
<rect x="660" y="120" width="240" height="110" fill="url(#tone3)"/>
<rect x="6" y="6" width="888" height="218" fill="none" stroke="#141414" stroke-width="12"/>
<g class="bob">
  <path d="M188,178 L164,222 L236,178" fill="#FFFFFF" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
  <rect x="70" y="34" width="760" height="146" rx="70" fill="#FFFFFF" stroke="#141414" stroke-width="5"/>
  <text x="450" y="100" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="34" fill="#141414" text-anchor="middle">Still learning. Still building.</text>
  <text x="450" y="148" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="34" fill="#141414" text-anchor="middle">Still figuring things out.</text>
</g>
</svg>
