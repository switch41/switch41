# Snake contribution animation for the profile README.
# Copy to: .github/workflows/snake.yml inside the switch41/switch41 repo, then push.
# First run: Actions tab → "Contribution Snake" → Run workflow.
# Output publishes to the `output` branch — the README already links to it.

name: Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7928CA&color_dots=#0E75B6,#4A3FC7,#7928CA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7928CA&color_dots=#0E75B6,#4A3FC7,#7928CA

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
